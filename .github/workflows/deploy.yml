# Descarga los precios, compila la web y la publica en GitHub Pages.
# Se ejecuta en cada push a main y cada media hora, que es lo que tarda
# el Ministerio en actualizar los precios.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se solapan dos ejecuciones, la nueva sustituye a la que estaba en cola
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run datos
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
