<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes de pintar la página para que no haya un destello en blanco.
      // La misma lógica está en src/hooks/useTema.ts
      ;(function () {
        var guardado = null
        try {
          guardado = localStorage.getItem('tema')
        } catch (e) {}
        var oscuro = guardado
          ? guardado === 'oscuro'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-bs-theme', oscuro ? 'dark' : 'light')
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      })()
    </script>
    <meta
      name="description"
      content="Precios actualizados de la gasolina y el gasóleo en las gasolineras de las islas Canarias"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Vista previa al compartir el enlace (LinkedIn, WhatsApp, X...). Las URLs deben ser absolutas -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Gasolina Canarias" />
    <meta property="og:title" content="Gasolina Canarias: la gasolina más barata de cada isla" />
    <meta
      property="og:description"
      content="Precios de la gasolina 95, 98 y el gasóleo en las casi 500 gasolineras de las siete islas Canarias, actualizados cada media hora."
    />
    <meta property="og:url" content="https://aledeleonez.github.io/appPrecioGasolinaLanzarote/" />
    <meta property="og:image" content="https://aledeleonez.github.io/appPrecioGasolinaLanzarote/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Gasolina Canarias: ranking de precios de la gasolina en Canarias" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Precio de la gasolina en Canarias | Gasolina Canarias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
