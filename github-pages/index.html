-->
<html lang="es">

    <link rel="canonical" href="https://gasolinacanarias.aledeleonez.workers.dev/" />
    <title>Gasolina Canarias se ha mudado</title>
    <script>
      var ruta = location.pathname.replace(/^\/PrecioGasolinaCanarias/, '') || '/'
      location.replace('https://gasolinacanarias.aledeleonez.workers.dev' + ruta + location.search)
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://gasolinacanarias.aledeleonez.workers.dev/" />
    </noscript>
  </head>
  <body>

      Gasolina Canarias se ha mudado a

</html>
